<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up – Talent Match</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="page-wrapper">
  <div class="card auth-card">

    <!-- Logo -->
    <div class="logo-circle">
        <img src="/frontend/assets/Logo.png" alt="Logo" class="logo-img">
    </div>

    <h1 class="title">Create your account</h1>
    <p class="subtitle">Start your journey with Talent Match</p>

    <!-- FORM -->
    <form id="signupForm" class="auth-form">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@email.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select id="role" required>
          <option value="CANDIDATE">Candidate</option>
          <option value="EMPLOYER">Employer</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>

    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
