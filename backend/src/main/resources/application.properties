# Application name
spring.application.name=talent-matching-platform

# Server port
server.port=8080

# H2 database configuration
spring.datasource.url=jdbc:h2:mem:talentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console enable
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow schema.sql and test_data.sql if you use them later
spring.sql.init.mode=always

# Better console formatting for SQL
spring.jpa.properties.hibernate.format_sql=true

# JWT secret key (must be long enough)
jwt.secret=MySuperSecureJwtSecretKeyForTalentMatchingPlatform2026

# JWT expiration time in milliseconds (24 hours)
jwt.expiration=86400000