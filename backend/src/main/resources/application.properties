# Application name
spring.application.name=talent-matching-platform

# Server port
server.port=8080

# H2 database configuration
spring.datasource.url=jdbc:h2:mem:talentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console enable
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow schema.sql and data.sql (we ship data.sql in src/main/resources for the H2 dev seed).
spring.sql.init.mode=always
# CRITICAL: data.sql must run AFTER Hibernate has created the tables from
# the JPA entities, otherwise the INSERTs target tables that don't exist
# yet. Without this flag the seed data silently fails to load and login
# breaks with "User not found" / "Role not found".
spring.jpa.defer-datasource-initialization=true

# Better console formatting for SQL
spring.jpa.properties.hibernate.format_sql=true

# JWT secret key (must be long enough)
jwt.secret=MySuperSecureJwtSecretKeyForTalentMatchingPlatform2026

# JWT expiration time in milliseconds (24 hours)
jwt.expiration=86400000